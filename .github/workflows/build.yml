name: Build Pearl
on:
  workflow_dispatch:
    inputs:
      tests_only:
        description: Run core tests only
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    # Standard Apple Silicon runner; uses the owner's included private-repo
    # allowance. No larger runner or automatic paid fallback.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version
      - name: Core tests
        run: swift test
      - name: Verify the favorite-protection test catches a broken guard
        run: |
          cp Sources/PearlCore/ReviewQueue.swift "$RUNNER_TEMP/ReviewQueue.swift"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Sources/PearlCore/ReviewQueue.swift')
          p.write_text(p.read_text().replace('!item.favorite && !protected.contains(item.id)', 'true'))
          PY
          if swift test --filter favoritesAndProtectedAssetsCannotBeQueued > "$RUNNER_TEMP/mutation.log" 2>&1; then
            cp "$RUNNER_TEMP/ReviewQueue.swift" Sources/PearlCore/ReviewQueue.swift
            echo 'ERROR: broken protection guard escaped the test'
            exit 1
          fi
          cp "$RUNNER_TEMP/ReviewQueue.swift" Sources/PearlCore/ReviewQueue.swift
          grep 'Expectation failed' "$RUNNER_TEMP/mutation.log"
      - name: Install XcodeGen
        if: ${{ !inputs.tests_only }}
        run: brew install xcodegen
      - name: Verify edited-photo recovery is covered
        run: |
          cp Sources/PearlCore/ScanCheckpoint.swift "$RUNNER_TEMP/ScanCheckpoint.swift"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Sources/PearlCore/ScanCheckpoint.swift')
          p.write_text(p.read_text().replace('item.modified == current.modified && ', ''))
          PY
          if swift test --filter checkpointSurvivesRelaunchAndReconcilesEdits > "$RUNNER_TEMP/checkpoint-mutation.log" 2>&1; then
            cp "$RUNNER_TEMP/ScanCheckpoint.swift" Sources/PearlCore/ScanCheckpoint.swift
            echo 'ERROR: stale photo analysis escaped the recovery test'
            exit 1
          fi
          cp "$RUNNER_TEMP/ScanCheckpoint.swift" Sources/PearlCore/ScanCheckpoint.swift
          grep 'Expectation failed' "$RUNNER_TEMP/checkpoint-mutation.log"
      - name: Build and verify
        if: ${{ !inputs.tests_only }}
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.tests_only && always() }}
        with:
          name: Pearl
          path: |
            build/*.ipa
            build/*.png
            build/*.log
            build/*.xcresult
            build/screenshots
          if-no-files-found: warn
          retention-days: 3
