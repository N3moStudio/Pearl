name: Build Pearl
on:
  workflow_dispatch:
    inputs:
      tests_only:
        description: Run core tests only
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version
      - name: Core tests
        run: swift test
      - name: Install XcodeGen
        if: ${{ !inputs.tests_only }}
        run: brew install xcodegen
      - name: Build and verify
        if: ${{ !inputs.tests_only }}
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.tests_only && always() }}
        with:
          name: Pearl
          path: |
            build/*.ipa
            build/*.png
            build/*.log
            build/*.xcresult
            build/screenshots
          if-no-files-found: warn
          retention-days: 7
