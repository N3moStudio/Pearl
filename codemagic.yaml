# Private GitLab source; manually started personal-account M2 builds only.
# No automatic triggers, publishing, billing changes or signing secrets.
workflows:
  pearl-vision-mac-diagnostics:
    name: Pearl private native Mac Vision check
    instance_type: mac_mini_m2
    max_build_duration: 10
    environment:
      xcode: "26.6"
    scripts:
      - name: Check actual Vision helpers on native Mac
        script: python3 scripts/vision_native_check.py
    artifacts:
      - build/vision-native.log
  pearl-scan-diagnostics:
    name: Pearl private Vision diagnostics
    instance_type: mac_mini_m2
    max_build_duration: 15
    environment:
      xcode: "26.6"
      vars:
        PEARL_SCAN_DIAGNOSTICS: 1
    scripts:
      - name: Prepare XcodeGen
        script: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Diagnose native image matching
        script: bash scripts/build.sh
    artifacts:
      - build/*.log
      - build/*.xcresult
      - build/screenshots/**
  pearl-private-ipa:
    name: Pearl private IPA and simulator checks
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: "26.6"
    scripts:
      - name: Check toolchain and install XcodeGen
        script: |
          set -euo pipefail
          if pgrep -lx xcodebuild; then
            echo 'An existing Xcode build needs review before another invocation.'
            exit 1
          else
            inventory_status=$?
            [[ "$inventory_status" == 1 ]] || exit "$inventory_status"
          fi
          xcodebuild -version
          command -v xcodegen >/dev/null || brew install xcodegen
      - name: Core tests
        script: |
          set -euo pipefail
          mkdir -p build
          swift test > build/core-tests.log 2>&1 || { tail -100 build/core-tests.log; exit 1; }
          tail -35 build/core-tests.log
      - name: Run simulator checks and build unsigned IPA
        script: bash scripts/build.sh
    artifacts:
      - build/*.ipa
      - build/*.log
      - build/*.json
      - build/*.xcresult
      - build/screenshots/**
