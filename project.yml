name: Pearl
options:
  bundleIdPrefix: com.n3mostudio
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '0.2.3'
    CURRENT_PROJECT_VERSION: '6'
packages:
  NativeSettingsKit:
    path: UI/NativeSettingsKit
  PearlCore:
    path: .
  ThinkingOrbs:
    url: https://github.com/Jakubantalik/Libraries.dev
    revision: 54722cc9a3dcb167037f7d449d6cca4d174e9eb5
targets:
  Pearl:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: NativeSettingsKit
      - package: PearlCore
      - package: ThinkingOrbs
        product: ThinkingOrbsKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.n3mostudio.pearl
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Pearl
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Pearl
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSPhotoLibraryUsageDescription: Pearl organizes your library and finds similar photos and videos on your device. Only items you review and confirm are removed.
        NSPhotoLibraryAddUsageDescription: Pearl creates albums you choose in your photo library.
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        UIBackgroundModes: [processing]
        BGTaskSchedulerPermittedIdentifiers: ['$(PRODUCT_BUNDLE_IDENTIFIER).scan.*']
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
  PearlScanTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/PearlScanTests, UI/NativeSettingsKit/Tests/NativeSettingsKitTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Pearl
      - package: PearlCore
      - package: NativeSettingsKit
  PearlUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Pearl
schemes:
  Pearl:
    build:
      targets:
        Pearl: all
    test:
      targets: [PearlScanTests, PearlUITests]
